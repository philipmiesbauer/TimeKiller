name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check versionCode update
      if: github.event_name == 'pull_request'
      run: |
        # Get current version code
        CURRENT_VERSION=$(grep "versionCode" app/build.gradle | tr -d '\r' | awk '{print $2}')
        echo "Current versionCode: $CURRENT_VERSION"
        
        # Get version code from target branch
        TARGET_VERSION=$(git show origin/${{ github.base_ref }}:app/build.gradle | grep "versionCode" | tr -d '\r' | awk '{print $2}')
        echo "Target branch (${{ github.base_ref }}) versionCode: $TARGET_VERSION"
        
        if [ -n "$TARGET_VERSION" ] && [ "$CURRENT_VERSION" -le "$TARGET_VERSION" ]; then
          echo "Error: versionCode must be incremented. Current: $CURRENT_VERSION, Target: $TARGET_VERSION"
          exit 1
        fi

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: production

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

    - name: Build Release Bundle
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew :app:bundleRelease

    - name: Upload to Google Play
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        packageName: uk.co.pranacreative.timekiller
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: internal
        status: completed
